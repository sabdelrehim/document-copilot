[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "openai==3.31.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai==2.57.0",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
    "structlog==26.1.0",
    "supabase==2.33.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that need live external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
venvPath = ".."
venv = ".venv"
extraPaths = ["."]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
